<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Operações — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="brand">Buzina Digital</div>
    <h1>Central de Operações</h1>

    <div id="login-error" class="login-error"></div>

    <form id="form-login" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="input-email" placeholder="seu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="input-senha" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn-login" class="btn btn-primary" style="width:100%;margin-top:8px;justify-content:center">
        Entrar
      </button>
    </form>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script>
  // Se já estiver logado, redireciona
  dbGetUser().then(user => {
    if (user) window.location.href = 'index.html';
  });

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('input-email').value;
    const senha = document.getElementById('input-senha').value;
    const btn   = document.getElementById('btn-login');
    const err   = document.getElementById('login-error');

    btn.disabled = true;
    btn.textContent = 'Entrando…';
    err.classList.remove('visible');

    try {
      await dbSignIn(email, senha);
      window.location.href = 'index.html';
    } catch (ex) {
      err.textContent = 'E-mail ou senha incorretos.';
      err.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }
</script>
</body>
</html>
